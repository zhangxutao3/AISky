<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AISky Local Map Host</title>
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <!-- Visual direction: cloud-white surfaces, slate text, and restrained mint/sky iridescence; the weather map remains the hero. -->
  <canvas id="map" tabindex="0" aria-label="AISky 本地气象地图。拖动平移，滚轮缩放，点击查看格点预报；左右方向键切换时次，空格播放或暂停，Home 恢复全球视图"></canvas>
  <canvas id="wind" aria-hidden="true"></canvas>
  <div class="typhoon-hover" id="typhoonHover" role="tooltip" hidden></div>
  <div class="typhoon-legend" id="typhoonLegend" aria-live="polite" hidden>
    <div class="typhoon-legend__models">
      <span><i class="model-line model-line--energy"></i>Energy</span>
      <span><i class="model-line model-line--sds"></i>SDS</span>
    </div>
    <div class="typhoon-legend__levels" aria-label="台风强度颜色">
      <span><i style="--level:#63d6c7"></i>热带低压</span>
      <span><i style="--level:#48a9f8"></i>热带风暴</span>
      <span><i style="--level:#72c96b"></i>强热带风暴</span>
      <span><i style="--level:#f2cb52"></i>台风</span>
      <span><i style="--level:#f3944f"></i>强台风</span>
      <span><i style="--level:#ed5972"></i>超强台风</span>
    </div>
    <div class="typhoon-legend__status" id="typhoonLegendStatus">正在分析本地模式</div>
  </div>
  <div class="coordinates" id="coordinates">经度 --　纬度 --</div>
  <section class="typhoon-panel" id="typhoonPanel" aria-label="模型模拟台风路径详情" hidden>
    <div class="typhoon-panel__header">
      <div>
        <div class="typhoon-panel__eyebrow" id="typhoonModel">AISky 模型模拟</div>
        <h2 id="typhoonName">模型模拟台风路径</h2>
      </div>
      <button class="point-close" id="typhoonClose" type="button" aria-label="关闭台风路径详情">
        <span aria-hidden="true"></span>
      </button>
    </div>
    <div class="typhoon-strength">
      <span class="typhoon-strength__dot" id="typhoonStrengthDot"></span>
      <div>
        <strong id="typhoonStrength">--</strong>
        <span id="typhoonWind">-- m/s</span>
      </div>
      <div class="typhoon-confidence">
        <span>识别置信度</span>
        <strong id="typhoonConfidence">--%</strong>
      </div>
    </div>
    <dl class="typhoon-metrics">
      <div><dt>有效时间</dt><dd id="typhoonTime">--</dd></div>
      <div><dt>预报时效</dt><dd id="typhoonLead">--</dd></div>
      <div><dt>中心气压</dt><dd id="typhoonPressure">-- hPa</dd></div>
      <div><dt>中心位置</dt><dd id="typhoonLocation">--</dd></div>
    </dl>
    <p class="typhoon-note">未来 5 天模型模拟路径，仅代表本地 SLP 与 WIND10 模式结果。</p>
  </section>
  <section class="point-panel" id="pointPanel" aria-label="格点预报详情" hidden>
    <div class="point-panel__header">
      <div class="point-panel__heading">
        <div class="point-location" id="pointLocation">经度 -- · 纬度 --</div>
        <h2 id="pointLayerName">格点预报</h2>
      </div>
      <button class="point-close" id="pointClose" type="button" aria-label="关闭格点预报详情">
        <span aria-hidden="true"></span>
      </button>
    </div>
    <div class="point-reading">
      <strong id="pointValue">--</strong>
      <span id="pointUnit"></span>
      <div id="pointValidTime">请选择地图中的格点</div>
    </div>
    <div class="point-chart__summary">
      <span id="pointRange">同一起报预报序列</span>
      <span id="pointCount">--</span>
    </div>
    <div class="point-chart">
      <canvas id="pointChart" aria-label="该格点的多时次预报曲线"></canvas>
      <div class="point-chart__empty" id="pointChartEmpty">正在读取本地预报序列</div>
    </div>
    <div class="point-chart__axis" aria-hidden="true">
      <span id="pointFirstTime">--</span>
      <span id="pointLastTime">--</span>
    </div>
    <div class="point-status" id="pointStatus" role="status" aria-live="polite">
      点击地图可查看格点的多时次变化
    </div>
  </section>
  <script src="typhoon-algorithm.js"></script>
  <script src="map.js"></script>
</body>
</html>
